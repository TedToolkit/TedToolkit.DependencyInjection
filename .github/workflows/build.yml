on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-build-project:
    if: github.ref != 'refs/heads/main'
    uses: TedToolkit/TedToolkit/.github/workflows/legacy-build.yml@b45c29c681eecdec42d23c3324e474a78f1902d9

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: TedToolkit/TedToolkit/.github/actions/publish-nuget-legacy@b45c29c681eecdec42d23c3324e474a78f1902d9
        with:
          nuget-user: ArchiTed

  verify-package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Install .NET runtimes for compatibility tests
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
          foreach ($channel in @('8.0', '9.0', '10.0')) {
            pwsh -NoProfile -ExecutionPolicy Bypass -File $installer -Runtime dotnet -Channel $channel -InstallDir $env:DOTNET_ROOT -SkipNonVersionedFiles -NoPath
            if ($LASTEXITCODE -ne 0) { throw "Installing .NET $channel runtime failed." }
          }
      - name: Verify package consumers and Native AOT
        shell: pwsh
        run: ./Build/Verify-Package.ps1 -NativeAot
